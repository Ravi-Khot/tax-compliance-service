

# ==========================================
# APPLICATION CONFIGURATION
# ==========================================
spring.application.name=tax-compliance-service
server.port=8080

# ==========================================
# DATABASE CONFIGURATION
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/tax_compliance_db
spring.datasource.username=postgres
spring.datasource.password=SmartCommerce@123

spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect




# ==========================================
# ERROR CONFIGURATION
# ==========================================
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=always


# DATABASE AUTHENTICATION
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:}

